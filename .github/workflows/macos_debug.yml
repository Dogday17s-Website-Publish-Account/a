name: macOS Remote Access
on: workflow_dispatch

jobs:
  remote-access:
    runs-on: macos-latest
    steps:
      - name: Setup SSH Keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

      - name: Start SSH Server
        run: |
          sudo systemsetup -setremotelogin on

      - name: Establish Tunnel
        run: |
          echo "Connecting to tunnel..."
          # This connects the VM to serveo.net
          ssh -o StrictHostKeyChecking=no -R mac-debug:22:localhost:22 serveo.net
