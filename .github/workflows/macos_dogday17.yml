name: macOS Remote Access
on: workflow_dispatch

jobs:
  remote-access:
    runs-on: macos-latest
    steps:
      - name: Setup SSH Keys
        run: |
          mkdir -p ~/.ssh
          # This ensures the key is written exactly as it appears in your secret
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          
          # Debug: This will show the last 10 characters of the key in the logs 
          # so you can verify it matches your terminal output
          echo "Key loaded ending in: $(tail -c 10 ~/.ssh/authorized_keys)"

      - name: Start SSH Server
        run: |
          sudo systemsetup -setremotelogin on

      - name: Establish Tunnel
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R mac-debug:22:localhost:22 serveo.net sleep 3600
