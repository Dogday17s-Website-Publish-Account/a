name: macOS GUI Access
on: workflow_dispatch

jobs:
  gui-access:
    runs-on: macos-latest
    steps:
      - name: Set macOS Password
        run: |
          # Modern command to set the password for the current user
          sudo sysadminctl -adminPassword "" -resetPasswordFor runneradmin -newPassword password123

      - name: Enable Screen Sharing
        run: |
          # Enable Apple Remote Desktop (VNC)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on \
          -clientopts -setvncpasswd -vncpasswd password123 \
          -restart -agent -privs -all

      - name: Install and Start Cloudflare Tunnel
        run: |
          brew install cloudflared
          # This will generate a temporary URL in the logs
          cloudflared tunnel --url tcp://localhost:5900
