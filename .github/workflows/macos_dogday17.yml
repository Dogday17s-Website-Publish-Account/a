name: macOS Web GUI
on: workflow_dispatch

jobs:
  gui:
    runs-on: macos-latest
    steps:
      - name: Set macOS Password
        run: |
          sudo sysadminctl -adminPassword "" -resetPasswordFor runneradmin -newPassword password123

      - name: Enable Screen Sharing
        run: |
          # Fixed kickstart command
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on \
          -allowAccessFor -allUsers -privs -all

      - name: Install noVNC Gateway
        run: |
          # Added --break-system-packages to bypass PEP 668
          pip3 install websockify --break-system-packages
          git clone https://github.com

      - name: Start Tunnel and Web Proxy
        run: |
          ./noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 8080 &
          brew install cloudflared
          cloudflared tunnel --url http://localhost:8080
